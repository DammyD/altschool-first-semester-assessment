<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application form | School of Engineering</title>
  </head>
  <body>
    <header>
      <div>
        <img src="alt-school-logo.png" alt="AltSchool Logo" />
      </div>
      <br/>
      <br/>
      <nav>
        <a href="index.html" aria-label="home">Home</a>
        <a href="form.html" aria-label="Application form">Application form</a>
      </nav>
    </header>
    <br>
    <br>
    <main>
      <div>
        <a href="#" aria-label="sign-up">Sign up</a>
        <a href="#" aria-label="sign-in">Sign in</a>
      </div>
      <h1>Sign in</h1>
      <p>Enter your email address and password to securely log in to AltSchool Student Portal</p>
      <form method="#" action="onSubmit">
        <fieldse>
          <label for="email">Email</label>
          <br/>
          <input type="email" id="email" name="email" placeholder="john.doe@example.com" autocomplete="email" required/>
          <br />
          <br/>
          <label for="password">Password</label>
          <br/>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required/>
          <br/>
          <br/>
          <button type="submit">Process to Dashboard →</button>
        </fieldset>
      </form>
      <p>Forget your password? <a href="#">Reset Now!</a></p>

      <p>OR</p>

      <button>Log in with Google</button>
    </main>
    <br/>
    <footer>
      <address>Lagos, Nigeria</address>
      <p>&copy; 2026, with love &#x2764;&#xfe0f;
 from Blessing Dawodu.</p>
    </footer>
  </body>
</html>
