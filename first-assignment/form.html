<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application form | School of Engineering</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" aria-label="home">Home</a>
        <a href="form.html" aria-label="Application form">Application form</a>
      </nav>
    </header>
    <main>
      <h1>Create Your ALT School Account</h1>
      <form>
        <fieldset>
          <legend>Personal Information</legend>
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="full-name" autocomplete="name" required/>
          <br />
          <br/>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" autocomplete="email" required/>
          <br />
          <br/>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required/>
          <br/>
          <br/>
          <label> <input type="checkbox" name="remember-me" /> Remember me </label>
          <br/>
          <br/>
          <button type="submit">Create Account</button>
        </fieldset>
      </form>
    </main>
    <footer>
      <address>Lagos, Nigeria</address>
      <p>&copy; 2026, with love &#x2764;&#xfe0f;
 from Blessing Dawodu.</p>
    </footer>
  </body>
</html>
