<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 1: Convert the design</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000;
        font-family: sans-serif;
      }
      .container {
        position: relative;
        width: 100%;
        max-width: 640px;
        padding: 50px;
        background-color: #222;
        border: 5px solid #ddd;
        border-bottom-width: 20px;
      }
      .container::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -12px;
        height: 12px;
        border: 1px solid #bbb;
        background-color: #eee;
      }
      .content {
        display: flow-root;
        max-width: 335px;
        padding: 0 27px 27px;
        border-radius: 8px;
        background-color: #fff;
      }
      h1 {
        margin: -16px 0 24px;
        padding: 16px;
        font-size: 1.8rem;
        font-weight: 900;
        text-align: center;
        color: #000;
        background-color: #ff0090;
        border-radius: 4px;
      }
      p {
        text-align: left;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="content">
          <h1>An Otter Essay</h1>
          <p>
            Otters have long, slim bodies and relatively short limbs. Their most
            striking anatomical features are the powerful webbed feet used to
            swim, and their seal-like abilities holding breath underwater.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
